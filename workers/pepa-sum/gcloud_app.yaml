app: pepa-sum               # label value (app=...)
prefix: pepa               # GCP resource-name prefix
region: europe-west1
type: service

artifact_registry:
  repo: pepa
  image: pepa/app:latest

service_account:
  name: pepa-sa
  display: "pepa-sum: self-hosted model"
  roles: [roles/run.invoker]

model: qwen2.5-3b-instruct   # the name the server answers to (MODEL_ALIAS in the Dockerfile)
context_tokens: 16384        # N_CTX in the Dockerfile

service:
  name: pepa
  allow_unauthenticated: false  # only your own Google account may call it
  memory: 8Gi                   # GGUF model + 16k-context KV cache
  cpu: 8                        # faster CPU generation at ~equal vCPU-second cost
  max_instances: 1
  concurrency: 1
  timeout: 900

# No schedulers: this service is called on demand by pepa-sum, not cron.
