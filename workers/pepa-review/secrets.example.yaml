# Anthropic API key: used for literature review assembly, gap-check explanations,
# and discovery responses. Set the ANTHROPIC_API_KEY env var to override.
anthropic_api_key: ""

# Gemini API key: used for document embeddings (Anthropic has no embedding API).
# This is the default embed provider. Set GEMINI_API_KEY env var to override.
gemini_api_key: ""

# Override the path to pepa-sum's output folder if it is not at ../pepa-sum/output.
# corpus_dir: "C:/path/to/pepa-sum/output"

# Model for fast generation (gap explanations, discovery responses).
# Default: claude-haiku-4-5-20251001
# anthropic_model: "claude-haiku-4-5-20251001"

# Model for literature review assembly (WS1, synthesis-heavy).
# Default: claude-sonnet-4-6
# review_model: "claude-sonnet-4-6"

# Generation backend: "anthropic" (default) or "openai-compatible", any server that
# accepts OpenAI's chat format (DeepSeek, Kimi, Qwen, Ollama, vLLM, LM Studio).
# backend: "openai-compatible"
# llm_base_url: "http://localhost:11434/v1"
# llm_model: "qwen3:8b"
# llm_quality_model: "qwen3:32b"   (defaults to llm_model)
# llm_api_key: ""                  (blank for a local server; PEPA_LLM_API_KEY overrides it)

# Embedding provider: "gemini" (default), "ollama", or "openai-compatible".
# Changing provider or model means rebuilding the index: python manage.py index --force
# embed_provider: "gemini"

# Optional: override the provider's embed model. Gemini models (check with ListModels):
#   gemini-embedding-001  (text, 2048-token input, default)
#   gemini-embedding-2    (multimodal, 8192-token input)
# embed_model: "gemini-embedding-001"

# For "ollama": the local Ollama service (default http://localhost:11434).
# ollama_base_url: "http://localhost:11434"

# For "openai-compatible": the server's address, and its key unless it runs locally.
# embed_base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
# embed_api_key: ""                (PEPA_EMBED_API_KEY overrides it)

# Bibliographic enrichment: activates DOI/venue/year metadata and citation signals
# in all work steps (gaps, review, map, graph). Requires biblio.db to be present
# (run: python manage.py biblio ingest). Default: false (all steps behave as
# without enrichment when this is off or biblio.db is absent).
# use_biblio: true
