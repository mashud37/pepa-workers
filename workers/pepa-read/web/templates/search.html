<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pepa-reader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="search-page">
    <h1>pepa-reader</h1>
    <div class="search-bar">
      <input id="q" type="text" placeholder="Search title, authors, summary... (try author:name)" autofocus>
    </div>
    <p id="status" class="status"></p>
    <table id="results">
      <thead>
        <tr><th>Title</th><th>Author</th><th>Text</th><th>Summary</th><th></th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="{{ url_for('static', filename='search.js') }}"></script>
</body>
</html>
