<div class="run" data-log="{{ log_url }}" data-poll="{{ poll_ms }}" data-read-url="{{ url_for('console.view_page', name='pepa-sum', slot='results', relative='sum_NAME.md') }}">
  <div class="run-head">
    <span class="status status-{{ run.status }}" data-status>{{ run.label }}</span>
    {% if run.steps %}
    <ol class="steps" data-steps>
      {% for step in run.steps %}<li><span class="dot dot-{{ step.status }}"></span>{{ step.label }}</li>{% endfor %}
    </ol>
    {% endif %}
    <span class="meta elapsed" data-elapsed>{{ run.elapsed }}</span>
    <form method="post" data-fetch="stop" data-confirm="Stop this run?" data-confirm-detail="The item in progress is lost. Finished work is skipped next time." data-confirm-button="Stop" hidden>
      <input type="hidden" name="token" value="{{ token }}">
      <button class="text danger">Stop</button>
    </form>
    <button type="button" class="text" data-run-close="{{ log_url[:-4] }}/dismiss"{% if run.status == "running" %} hidden{% endif %}>Close</button>
  </div>
  <p class="run-now" data-now role="status" hidden></p>
  <div class="items" data-items hidden>
    <div class="items-head"><span class="items-count" data-items-count></span><span class="items-bar"><span data-items-bar></span></span></div>
    <ul class="item-list" data-items-running></ul>
    <ul class="item-list" data-items-finished></ul>
  </div>
  <details class="log-details" data-log-details open>
    <summary>Log</summary>
    <pre class="log" data-lines><span class="pending" data-pending></span></pre>
  </details>
  <form class="answer" method="post" data-fetch="answer" hidden>
    <input type="hidden" name="token" value="{{ token }}">
    <input type="text" name="text" autocomplete="off" aria-label="Answer" placeholder="Answer, then press Enter">
    <button class="tonal">Send</button>
  </form>
</div>
