# Anthropic API key — used for skeleton labelling, outline generation, and review.
# Set the ANTHROPIC_API_KEY env var to override.
anthropic_api_key: ""

# Override the path to pepa-sum's output folder if it is not at ../pepa-sum/output.
# corpus_dir: "C:/path/to/pepa-sum/output"

# Model for fast generation (move labelling). Default: claude-haiku-4-5-20251001
# anthropic_model: "claude-haiku-4-5-20251001"

# Model for quality generation (outline, refine, review). Default: claude-sonnet-4-6
# review_model: "claude-sonnet-4-6"
