# pepa-draft secrets: copy to secrets.yaml and fill in real values.
# secrets.yaml is gitignored; NEVER commit the real file.

# Generation backend: anthropic (default), openai-compatible (any server that accepts
# OpenAI's chat format: DeepSeek, Kimi, Qwen, Ollama, vLLM, LM Studio), or vllm
# (the Cloud Run service below)
# backend: openai-compatible

# Anthropic API (required for anthropic backend)
anthropic_api_key: REPLACE_ME

# OpenAI-compatible server (for openai-compatible backend); the key stays blank
# for a local server, and PEPA_LLM_API_KEY overrides it
# llm_base_url: http://localhost:11434/v1
# llm_model: qwen3:32b
# llm_api_key: REPLACE_ME

# Embedding provider for the style index: gemini (default), ollama, or openai-compatible.
# Queries against the review index always use the model that built that index.
# embed_provider: gemini
# embed_model: gemini-embedding-001

# Gemini embeddings (for embed_provider gemini)
gemini_api_key: REPLACE_ME

# Ollama embeddings (for embed_provider ollama)
# ollama_base_url: http://localhost:11434

# OpenAI-compatible embeddings (for embed_provider openai-compatible); PEPA_EMBED_API_KEY overrides the key
# embed_base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
# embed_api_key: REPLACE_ME

# Cloud Run vLLM service (optional; for vllm backend)
# vllm_base_url: https://YOUR-SERVICE-URL
# vllm_token: REPLACE_ME

# Path to pepa-review index (default: ../pepa-review/data/index.json)
# review_index: /path/to/pepa-review/data/index.json
