package: pepa-workers
version: "0.3.2"
summary: "Standalone tools that augment academic work: read and condense literature, map a field, find gaps, outline, and draft to test ideas."
license: "MIT"
python: ">=3.10"

base:
  - pyyaml
  - flask

apps:
  pepa-prep:
    released: false
    leave_out:
      - data/eval
      - evaluate
      - cli/eval_cmd.py
  pepa-sum:
    released: false
    leave_out: []
  pepa-read:
    released: false
    leave_out: []
  pepa-review:
    released: false
    leave_out:
      - BRIEFING.md
  pepa-plan:
    released: false
    leave_out:
      - BRIEFING.md
      - benchmark
  pepa-draft:
    released: false
    leave_out: []
  pepa-host:
    released: false
    leave_out: []
  pepa-console:
    released: false
    leave_out: []
