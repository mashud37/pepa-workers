package: pepa-workers
version: "0.1.0"
summary: "Standalone tools that augment academic work: read and condense literature, map a field, find gaps, outline, and draft to test ideas."
license: "MIT"
python: ">=3.10"

base:
  - pyyaml
  - flask

apps:
  pepa-prep:
    released: false
    leave_out:
      - data/eval
  pepa-sum:
    released: false
    leave_out:
      - Dockerfile
      - deploy.ps1
      - deploy.sh
      - gcloud_app.yaml
      - requirements-serve.txt
      - serve
  pepa-read:
    released: false
    leave_out: []
  pepa-review:
    released: false
    leave_out:
      - BRIEFING.md
  pepa-plan:
    released: false
    leave_out:
      - BRIEFING.md
      - benchmark
  pepa-draft:
    released: false
    leave_out: []
  pepa-console:
    released: false
    leave_out: []
