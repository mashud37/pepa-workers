name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: windows-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pepa-workers
    permissions:
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the bundle's dependencies
        run: python -m pip install -r requirements.txt

      - name: Check the tag matches the version in workers.yaml
        shell: python
        run: |
          import os
          import yaml
          with open("workers.yaml", encoding="utf-8") as file:
              version = yaml.safe_load(file)["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"The tag {tag} does not match version {version} in workers.yaml.")

      - name: Release gate
        run: python manage.py check

      - name: Build the wheel
        run: python manage.py bundle

      - name: Smoke test the wheel
        run: python manage.py test

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
